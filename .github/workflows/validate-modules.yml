name: Validate Modules

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'content/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/validate-modules.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'modules/**'
      - 'content/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/validate-modules.yml'

jobs:
  validate:
    name: Validate Module Schema & Slugs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run module validator
        run: |
          python3 scripts/validate_module.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Verify static site build
        run: npm run build
