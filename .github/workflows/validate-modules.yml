name: Validate Modules

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'locales/**'
      - 'content/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-modules.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'modules/**'
      - 'locales/**'
      - 'content/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-modules.yml'

jobs:
  validate:
    name: Validate Module Schema, Localization & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run module schema validator
        run: |
          python3 scripts/validate_module.py

      - name: Run EN + ZH SEO & localization discovery audit
        run: |
          python3 scripts/validate_seo_llm_discovery.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify static site build
        run: npm run build

      - name: Run production dist & i18n SEO tests
        run: |
          python3 scripts/verify_production_dist.py
          python3 -m unittest discover -s tests -p "test_*.py" -v
